plugins {
	id 'net.fabricmc.fabric-loom' version "${build_tool_version}"
}

base {
	archivesName = project.archives_base_name
}
// Artifact naming: boathud&map-v3-26.2.jar — mod name + mod version + target Minecraft version,
// so the jar is self-identifying (Minecraft 26.2 has no "1." prefix in its version string).
version = "${project.mod_version}-${project.minecraft_version}"
group = project.maven_group

repositories {
	// Domestic mirror first (preferred); falls back to official if unreachable.
	maven { url "https://bmclapi2.bangbang93.com/maven" }
	maven { url "https://maven.fabricmc.net/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url "https://maven.shedaniel.me/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation "com.terraformersmc:modmenu:${menu_version}"
	api("me.shedaniel.cloth:cloth-config-fabric:${cloth_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("*.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	// Official v1.3.1 (Minecraft 26.2) targets Java 25; modmenu 20.0.0-beta.4 and
	// cloth-config 26.2.155 are compiled for JVM 25, so we must build with JDK 25.
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
